server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6000/job_queue_db}
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
  threads:
    virtual:
      enabled: true

schedule:
  cron:
    consume: "*/10 * * * * *"
    retry: "0 */3 * * * *"
    heartbeat: "*/5 * * * * *"

logging:
  file:
    name: ${LOGGING_FILE_NAME:docs/logs/worker-${hostname}.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} %clr([%thread]){magenta} %clr(%-5level){yellow} %clr(%logger{36}){green} - %clr([worker:%property{hostname}]){blue} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [worker:%property{hostname}] - %msg%n"
  level:
    root: INFO
