server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6000/job_queue_db}
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
  threads:
    virtual:
      enabled: true

schedule:
  cron:
    consume: "*/10 * * * * *"
    retry: "0 */3 * * * *"
