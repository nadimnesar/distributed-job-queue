spring:
  application:
    name: worker-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
schedule:
  cron:
    consume: "*/10 * * * * *"
    retry: "0 */3 * * * *"
    heartbeat: "*/5 * * * * *"

app:
  rabbitmq:
    startup-check:
      enabled: false
