server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: producer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6000/job_queue_db}
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: false
    change-log: src/main/resources/db/master.json
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

logging:
  file:
    name: ${LOGGING_FILE_NAME:docs/logs/producer-${hostname}.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} %clr([%thread]){magenta} %clr(%-5level){yellow} %clr(%logger{36}){green} - %clr([producer:%property{hostname}]){blue} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [producer:%property{hostname}] - %msg%n"
  level:
    root: INFO
