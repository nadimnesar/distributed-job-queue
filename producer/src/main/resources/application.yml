server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: producer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6000/job_queue_db}
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: false
    change-log: src/main/resources/db/master.json
  data:
    redis:
      host: localhost
      port: 6379
