server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: producer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.49.2:30432/appdb?prepareThreshold=0}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppass}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:120000}
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.49.2}
    port: ${RABBITMQ_PORT:30672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false
    template:
      mandatory: true
    publisher-confirm-type: correlated

logging:
  file:
    name: ${LOGGING_FILE_NAME:docs/logs/producer-${hostname}.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} %clr([%thread]){magenta} %clr(%-5level){yellow} %clr(%logger{36}){green} - %clr([producer:%property{hostname}]){blue} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [producer:%property{hostname}] - %msg%n"
  level:
    root: INFO
