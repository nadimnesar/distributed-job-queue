x-service-defaults: &service-defaults
  restart: always
  networks:
    - app-network

x-producer-common: &producer-common
  <<: *service-defaults
  build:
    context: ./producer
    dockerfile: Dockerfile
  environment: &producer-env
    SERVER_PORT: 8080
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_queue_db

x-worker-common: &worker-common
  <<: *service-defaults
  build:
    context: ./worker
    dockerfile: Dockerfile
  environment: &worker-env
    SERVER_PORT: 8085
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_queue_db

services:
  nginx:
    <<: *service-defaults
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - producer_1
      - producer_2
      - producer_3
      - worker_1
      - worker_2
      - worker_3
      - worker_4
      - worker_5
    networks:
      - app-network

  producer_1:
    <<: *producer-common
    container_name: producer_1
    environment:
      <<: *producer-env
      SERVER_NAME: producer_1

  producer_2:
    <<: *producer-common
    container_name: producer_2
    environment:
      <<: *producer-env
      SERVER_NAME: producer_2

  producer_3:
    <<: *producer-common
    container_name: producer_3
    environment:
      <<: *producer-env
      SERVER_NAME: producer_3

  worker_1:
    <<: *worker-common
    container_name: worker_1
    environment:
      <<: *worker-env
      SERVER_NAME: worker_1

  worker_2:
    <<: *worker-common
    container_name: worker_2
    environment:
      <<: *worker-env
      SERVER_NAME: worker_2

  worker_3:
    <<: *worker-common
    container_name: worker_3
    environment:
      <<: *worker-env
      SERVER_NAME: worker_3

  worker_4:
    <<: *worker-common
    container_name: worker_4
    environment:
      <<: *worker-env
      SERVER_NAME: worker_4

  worker_5:
    <<: *worker-common
    container_name: worker_5
    environment:
      <<: *worker-env
      SERVER_NAME: worker_5

networks:
  app-network:
    external: true
