x-service-defaults: &service-defaults
  restart: always
  networks:
    - app-network

services:
  nginx:
    <<: *service-defaults
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - producer
      - worker
    networks:
      - app-network

  producer:
    <<: *service-defaults
    build:
      context: ./producer
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_queue_db
    deploy:
      replicas: 3

  worker:
    <<: *service-defaults
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_queue_db
    deploy:
      replicas: 5

networks:
  app-network:
    external: true
