apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: distributed-job-queue
data:
  definitions.json: |
    {
      "rabbit_version": "3.12.0",
      "global_parameters": [
        {
          "name": "cluster_name",
          "value": "rabbit@distributed-job-queue"
        }
      ],
      "vhosts": [
        {
          "name": "/"
        }
      ],
      "users": [
        {
          "name": "admin",
          "password": "admin",
          "tags": "administrator"
        }
      ],
      "exchanges": [
        {
          "name": "job.exchange",
          "vhost": "/",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "queue.high",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-quorum-initial-group-size": 3,
            "x-dead-letter-exchange": "job.exchange",
            "x-dead-letter-routing-key": "queue.retry",
            "x-dead-letter-strategy": "at-least-once",
            "x-overflow": "reject-publish"
          }
        },
        {
          "name": "queue.medium",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-quorum-initial-group-size": 3,
            "x-dead-letter-exchange": "job.exchange",
            "x-dead-letter-routing-key": "queue.retry",
            "x-dead-letter-strategy": "at-least-once",
            "x-overflow": "reject-publish"
          }
        },
        {
          "name": "queue.low",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-quorum-initial-group-size": 3,
            "x-dead-letter-exchange": "job.exchange",
            "x-dead-letter-routing-key": "queue.retry",
            "x-dead-letter-strategy": "at-least-once",
            "x-overflow": "reject-publish"
          }
        },
        {
          "name": "queue.retry",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-quorum-initial-group-size": 3,
            "x-message-ttl": 30000,
            "x-dead-letter-exchange": "job.exchange",
            "x-overflow": "reject-publish"
          }
        },
        {
          "name": "queue.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-quorum-initial-group-size": 3,
            "x-overflow": "reject-publish"
          }
        }
      ],
      "permissions": [
        {
          "user": "admin",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "policies": [],
      "bindings": [
        {
          "source": "job.exchange",
          "vhost": "/",
          "destination": "queue.high",
          "destination_type": "queue",
          "routing_key": "queue.high",
          "arguments": {}
        },
        {
          "source": "job.exchange",
          "vhost": "/",
          "destination": "queue.medium",
          "destination_type": "queue",
          "routing_key": "queue.medium",
          "arguments": {}
        },
        {
          "source": "job.exchange",
          "vhost": "/",
          "destination": "queue.low",
          "destination_type": "queue",
          "routing_key": "queue.low",
          "arguments": {}
        },
        {
          "source": "job.exchange",
          "vhost": "/",
          "destination": "queue.retry",
          "destination_type": "queue",
          "routing_key": "queue.retry",
          "arguments": {}
        },
        {
          "source": "job.exchange",
          "vhost": "/",
          "destination": "queue.dlq",
          "destination_type": "queue",
          "routing_key": "queue.dlq",
          "arguments": {}
        }
      ]
    }
