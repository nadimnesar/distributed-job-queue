apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      *fluentbit*,*coredns*,*kube-proxy*,*storage-provisioner*,*csi-*
        Parser            docker
        DB                /var/log/flb/flb_kube.db
        DB.Sync           Normal
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Labels              On
        Annotations         Off
        Merge_Log           On
        Keep_Log            Off

    [FILTER]
        Name          lua
        Match         kube.*
        script        /fluent-bit/etc/extract_app.lua
        call          extract_app

    [OUTPUT]
        Name                es
        Match               *
        Host                elasticsearch.observability.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix_Key app_name
        Logstash_Prefix     logs
        Suppress_Type_Name  On
        Generate_ID         On
        Retry_Limit         5

  extract_app.lua: |
    function extract_app(tag, timestamp, record)
        local k8s = record["kubernetes"]
        if k8s and k8s["labels"] and k8s["labels"]["app"] then
            record["app_name"] = k8s["labels"]["app"]
        else
            record["app_name"] = "system"
        end
        return 1, timestamp, record
    end

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
