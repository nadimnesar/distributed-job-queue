apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-load-definitions
  namespace: distributed-job-queue
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: loader
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 30); do
                if curl -sf -u admin:admin http://rabbitmq:15672/api/overview > /dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              curl -sf -u admin:admin -X POST \
                -H "Content-Type: application/json" \
                -d @/etc/rabbitmq/definitions.json \
                http://rabbitmq:15672/api/definitions
          volumeMounts:
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
      volumes:
        - name: definitions
          configMap:
            name: rabbitmq-definitions
