openapi: 3.0.3

info:
  title: Distributed Job Queue API
  version: 1.0.0
  description: |
    ## Overview

    The Distributed Job Queue API provides a REST interface to the **producer
    service** of a distributed, priority-based job processing system. Jobs are
    submitted through this API, persisted in PostgreSQL, and dispatched to
    RabbitMQ for asynchronous processing by worker instances.

    ## Architecture

    ```
    ┌────────────┐      POST /api/v1/job/create      ┌──────────────┐
    │  Producer   │ ──────────────────────────────────▶│  PostgreSQL   │
    │  (this API) │                                    │  (jobs table)  │
    └──────┬─────┘                                    └──────┬───────┘
           │                                                 │
           │  afterCommit()                                  │
           ▼                                                 ▼
    ┌──────────────┐   consume / publish   ┌──────────────────────┐
    │   RabbitMQ    │◀────────────────────▶│     Worker Service    │
    │  (quorum      │                      │  (separate deployable)│
    │   queues)     │                      └──────────────────────┘
    └──────────────┘
    ```

    - **Producer** (this service): Accepts job submissions, validates
      dependencies via a DAG check, persists jobs, and publishes them to
      RabbitMQ only **after the database transaction commits**
      (`TransactionSynchronization.afterCommit`). This guarantees that
      a job only enters the queue if it was successfully persisted.
    - **Workers**: Independent deployables that consume from priority queues,
      process jobs, and acknowledge or reject messages.
    - **RabbitMQ**: Five quorum queues — HIGH, MEDIUM, LOW priority queues
      (ordered by consumer priority), a RETRY queue (30-second TTL, consumed
      and re-published to the original priority queue), and a DEAD_LETTER
      queue (at-least-once strategy; messages that exceed `maxAttemptCount`
      land here). Queues are configured with reject-publish overflow
      strategy to prevent unbounded memory growth.
    - **PostgreSQL**: Source of truth for job state. Workers update status
      transitions in the database and the queue is treated as an
      at-most-once/at-least-once delivery mechanism depending on the
      failure mode.

    ## Tech Stack

    | Layer            | Technology                        |
    |------------------|-----------------------------------|
    | Runtime          | Java 21, Spring Boot 3            |
    | Persistence      | PostgreSQL (via Spring Data JPA)  |
    | Messaging        | RabbitMQ (quorum queues)          |
    | API docs         | OpenAPI 3.0.3 (this file)         |
    | Ingress          | NGINX Ingress on Kubernetes       |
    | Observability    | Distributed tracing (traceId / spanId) |

    ## Rate Limiting

    Rate limiting is enforced at the **NGINX Ingress** layer, not within the
    application itself. Limits are configured per-ingress annotation and apply
    to the combined `/api/v1` path. The application does not return
    `429 Too Many Requests`; if you receive one, it originated from the
    ingress controller.

    ## Distributed Tracing

    Every response may include `traceId` and `spanId` fields in the
    `CommonResponse` envelope. These are populated when a distributed tracing
    context (e.g. W3C Trace Context) is present on the incoming request.
    They are `null` when no tracing headers are provided. Use them to
    correlate requests across the producer and worker services.

    ## Error Envelope Philosophy

    All responses — success and error — are wrapped in a `CommonResponse`
    envelope with the structure:

    ```json
    {
      "message": "Human-readable status message",
      "code": 200,
      "data": { "..." : "..." },
      "traceId": "...",
      "spanId": "..."
    }
    ```

    On **error** responses, `data` is **always omitted**. The `message` field
    contains a human-readable explanation suitable for logging and debugging
    (but not for end-user display, as it may contain internal details). The
    `code` field mirrors the HTTP status code.

    The global `ExceptionHandler` maps exceptions as follows:

    | Exception                              | HTTP Status | Message pattern                      |
    |----------------------------------------|-------------|--------------------------------------|
    | `MethodArgumentNotValidException`      | 400         | Field-level validation messages      |
    | `ConstraintViolationException`         | 400         | `"Bad request"`                      |
    | `HttpMessageNotReadableException`      | 400         | `"Malformed JSON request"`           |
    | `IllegalArgumentException`            | 400         | Exception message (business rule)    |
    | `IllegalStateException`               | 409         | Exception message (state conflict)   |
    | Any other `Exception`                 | 500         | `"Internal server error"`            |

    ## Job Lifecycle

    Jobs follow a strict state machine:

    ```
    PENDING ──▶ PROCESSING ──▶ COMPLETED   (happy path)
                  │
                  ├──▶ FAILED ──▶ PENDING   (auto-retry, attemptCount < maxAttemptCount)
                  │       │
                  │       └──▶ DEAD          (attemptCount >= maxAttemptCount, manual revive required)
                  │
                  └──▶ CANCELED             (terminal; dependents are informed)
    ```

    - **PENDING**: Job created and waiting in the queue.
    - **PROCESSING**: A worker has picked up the job.
    - **COMPLETED**: Job finished successfully; `result` may contain output.
    - **FAILED**: Job failed but retries remain; automatically re-queued.
    - **DEAD**: All retries exhausted; requires manual revive via
      `POST /api/v1/jobs/{id}/revive` or `POST /api/v1/jobs/revive`.
    - **CANCELED**: Job was cancelled by the producer; terminal state.

    ## DAG-Based Dependency System

    Jobs can declare up to **100 dependencies** (UUIDs of other jobs). The
    system enforces:

    1. **Existence**: All dependency UUIDs must reference existing jobs.
    2. **No terminal deps**: A job cannot depend on a CANCELED or DEAD job.
    3. **Priority hierarchy**: A HIGH-priority job cannot depend on a
       MEDIUM or LOW job. MEDIUM cannot depend on LOW. This prevents
       lower-priority work from blocking higher-priority work indefinitely.
    4. **DAG integrity**: Dependencies form a directed acyclic graph; cyclic
       dependencies are rejected at submission time.

    When all dependencies complete, the job becomes eligible for processing.
  contact:
    name: nadimnesar
  license:
    name: MIT

